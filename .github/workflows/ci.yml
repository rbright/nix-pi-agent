name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Make JavaScript actions use the patched system trust store instead of the
    # runner's bundled Node CA snapshot (fix pending: nodejs/node#66871).
    env:
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

    steps:
      # eMudhra CA compromise (https://emudhra.we-have-a-problem.com/): patch the
      # runner trust store before later steps use TLS. Remove this step and the
      # job env once ubuntu-latest ships ca-certificates 20260816 or later and
      # the runner's Node includes the fix.
      - name: Update CA trust store
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --only-upgrade --yes ca-certificates
          version="$(dpkg-query --showformat='${Version}' --show ca-certificates)"
          echo "ca-certificates ${version}"
          dpkg --compare-versions "${version}" ge 20260816

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Format check (Nix)
        run: just fmt-check

      - name: Lint
        run: just lint

      - name: Flake checks
        run: nix flake check --all-systems path:.

      - name: Build package
        run: just build

      - name: Run pi --help
        run: nix run 'path:.#pi-agent' -- --help
